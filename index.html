*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);word-break:keep-all;-webkit-text-size-adjust:100%;line-height:1.4;overflow:hidden;overscroll-behavior:none}

.hud{display:flex;align-items:center;gap:8px;min-width:0}

.dots i.now{border-color:var(--steel);box-shadow:0 0 0 3px var(--steel-soft)}
.chipbtn{flex:none;min-height:44px;padding:0 12px;border-radius:22px;border:1.5px solid var(--steel);background:var(--panel);color:var(--steel);font-size:13.5px;font-weight:800;white-space:nowrap}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}

.stage{min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:2px 0}

.stem{stroke:var(--ink);stroke-width:1.5}

.dot{fill:var(--ink)}
.curve{fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round}
.headline{stroke:var(--water);stroke-width:2;stroke-linecap:round;opacity:0}
.running .headline{opacity:.9}
.pipes{position:relative;flex:none;padding-bottom:42px}
.pipes.veiled svg,.pipes.veiled #joints{visibility:hidden}
.veil{position:absolute;left:8px;right:8px;top:6px;bottom:8px;border:1.5px dashed var(--pipe-edge);border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:13.5px;font-weight:700;color:var(--ink-2);background:var(--panel)}
.veil[hidden]{display:none}
.rowline{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.rowname{font-size:12px;font-weight:700;fill:var(--ink-2)}

.coupler{fill:var(--brass-soft);stroke:var(--brass);stroke-width:1.5}
.seam{stroke:var(--pipe-edge);stroke-width:1.2;stroke-dasharray:2 3;opacity:.7}

.chip.slur{border:1.5px solid var(--brass);background:var(--brass-soft)}

.controls{height:104px;position:relative}
.grp{position:absolute;inset:0;display:grid;gap:8px}
.grp[hidden]{display:none}
#g-count,#g-pipe,#g-deliver{grid-template-rows:44px 52px}
.row{display:grid;gap:6px;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);min-width:0}
.opt{border-radius:10px;border:1.5px solid var(--line);background:var(--panel);font-size:14px;font-weight:800;min-width:0;padding:0 4px}
.opt[hidden]{display:none}

.primary{border:0;border-radius:10px;background:var(--steel);color:#fff;font-size:16px;font-weight:800;min-width:0}

.second[hidden]{display:none}

.rec b{color:var(--ink)}
.sheet{position:fixed;inset:0;z-index:10;background:rgba(21,35,44,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet[hidden]{display:none}
.panel{width:100%;max-width:420px;max-height:100%;overflow:auto;background:var(--panel);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}

.toggle button{min-width:84px}
.small{font-size:12.5px;color:var(--ink-2)}

<script>// Reference implementation: appendix C.1–C.3, design v1.0 (2026-11-14).

// ═══ 음표 파이프 공방 · 이론 엔진 초안 ═══
// 길이는 전부 분수다. 소수로 바꾸는 곳은 화면 좌표와 소리 시각뿐이다.
// 음표 길이 표도, "이 곡선은 붙임줄" 같은 이름표도 두지 않는다. 곡선의 이름은 양 끝 음에서 읽는다.

// ── 분수 ──
const gcd = (a, b) => (b ? gcd(b, a % b) : Math.abs(a));
const F = (n, d = 1) => { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d) || 1; return { n: n / g, d: d / g }; };
const add = (a, b) => F(a.n * b.d + b.n * a.d, a.d * b.d);
const sub = (a, b) => F(a.n * b.d - b.n * a.d, a.d * b.d);
const mul = (a, b) => F(a.n * b.n, a.d * b.d);
const div = (a, b) => F(a.n * b.d, a.d * b.n);
const eq = (a, b) => a.n === b.n && a.d === b.d;
const lt = (a, b) => a.n * b.d < b.n * a.d;
const minF = (a, b) => (lt(a, b) ? a : b);
const num = (a) => a.n / a.d;
const str = (a) => (a.d === 1 ? String(a.n) : a.n + "/" + a.d);
const isPow2 = (x) => Number.isInteger(x) && x > 0 && (x & (x - 1)) === 0;

// ── 음표 길이와 음높이 ──
const noteWhole = (den, dots = 0) => F(2 ** (dots + 1) - 1, den * 2 ** dots);        // 온음표 = 1
const toBeats = (whole, beatDen = 4) => mul(whole, F(beatDen));                      // 박자표의 아래 숫자가 한 박
const MAJOR = [2, 2, 1, 2, 2, 2, 1];                                                 // 장음계 공식: 온 온 반 온 온 온 반
const semis = (letter) => MAJOR.slice(0, letter).reduce((s, x) => s + x, 0);
const midiOf = (p) => 12 * (p.oct + 1) + semis(p.letter);
const hz = (midi) => 440 * Math.pow(2, (midi - 69) / 12);
const stepOf = (p) => p.letter + 7 * (p.oct - 4);                                    // 가온 도 = 0. 오선의 줄과 칸을 하나씩 센다
const samePitch = (a, b) => a.letter === b.letter && a.oct === b.oct;

// ── 의뢰: 씨앗만 적는다. 음표 "C4/4 C4/4 D4/4 E4/4"(음이름·옥타브/음표 분모, 점은 뒤에 .), 이음매 "tss"(t 붙임, s 이음, g 뗌) ──
const LETTERS = "CDEFGAB";
const JOINT = { g: "gap", s: "slur", t: "tie" };
function parseNotes(text) {
  return text.trim().split(/\s+/).filter((tok) => tok !== "|").map((tok) => {
    const m = /^([A-G])(\d)\/(\d+)(\.*)$/.exec(tok);
    if (!m) throw new Error("음표 씨앗을 읽을 수 없다: " + tok);
    return { p: { letter: LETTERS.indexOf(m[1]), oct: +m[2] }, den: +m[3], dots: m[4].length };
  });
}
const parseJoints = (text, n) => Array.from({ length: n - 1 }, (_, k) => JOINT[(text || "")[k]] || "gap");
function makeJob(seed) {
  const meter = seed.meter.split("/").map(Number), notes = parseNotes(seed.notes);
  return { id: seed.id || "", meter, notes, joints: parseJoints(seed.joints, notes.length), bpm: seed.bpm || 60 };
}

// ── 시간 ──
const durOf = (job, i) => toBeats(noteWhole(job.notes[i].den, job.notes[i].dots), job.meter[1]);
function starts(job) { const out = []; let t = F(0); job.notes.forEach((_, i) => { out.push(t); t = add(t, durOf(job, i)); }); return out; }
const totalBeats = (job) => job.notes.reduce((t, _, i) => add(t, durOf(job, i)), F(0));
const barBeats = (job) => F(job.meter[0]);
const floorF = (a) => Math.floor(a.n / a.d);
function fitsBars(job) {                                                             // 음표 하나는 마디 하나 안에 있고, 마지막 마디가 꽉 찬다
  const bar = barBeats(job), st = starts(job), total = totalBeats(job);
  const inside = job.notes.every((_, i) => !lt(mul(F(floorF(div(st[i], bar)) + 1), bar), add(st[i], durOf(job, i))));
  return inside && div(total, bar).d === 1;
}
const onBar = (job, k) => div(starts(job)[k + 1], barBeats(job)).d === 1;            // 이음매 k가 마디선 위에 있는가

// ── 이음매: 뗌(gap) · 이음(slur) · 붙임(tie) ──
const canTie = (job, k) => samePitch(job.notes[k].p, job.notes[k + 1].p);
function withJoint(job, k, state) {                                                  // 붙임은 같은 높이에서만 된다
  if (state === "tie" && !canTie(job, k)) return { ok: false, why: "pitch", job };
  const joints = job.joints.slice(); joints[k] = state;
  return { ok: true, job: Object.assign({}, job, { joints }) };
}
const validJoints = (job) => job.joints.every((jt, k) => jt !== "tie" || canTie(job, k));
const gapBeats = (dur) => minF(F(1, 4), div(dur, F(2)));                             // 뗌: 소리 끝에서 1/4박을 비운다. 짧은 소리는 절반까지만

// 소리 목록: 붙임으로 이어진 음표들을 소리 하나로 합친다
function sounds(job) {
  const st = starts(job), out = [];
  for (let i = 0; i < job.notes.length;) {
    let j = i, dur = durOf(job, i);
    while (j < job.joints.length && job.joints[j] === "tie") { j++; dur = add(dur, durOf(job, j)); }
    const before = i === 0 ? null : job.joints[i - 1], after = j < job.joints.length ? job.joints[j] : null;
    const gap = after === "gap" ? gapBeats(dur) : F(0);
    out.push({ p: job.notes[i].p, from: i, to: j, start: st[i], dur, gap, len: sub(dur, gap), attack: before === "slur" ? "legato" : "fresh", after });
    i = j + 1;
  }
  return out;
}
const bells = (job) => sounds(job).length;                                           // 방울 = 소리 시작
function streams(job) {                                                              // 물줄기: 뗌으로 나뉜 구간 [첫 음, 끝 음]
  const out = []; let a = 0;
  job.joints.forEach((jt, k) => { if (jt === "gap") { out.push([a, k]); a = k + 1; } });
  out.push([a, job.notes.length - 1]);
  return out;
}

// ── 악보의 곡선 ──
function toCurves(job) {                                                             // 이음매 → 곡선. 이음줄은 물줄기의 첫 음에서 끝 음까지
  const ties = [], slurs = [];
  job.joints.forEach((jt, k) => { if (jt === "tie") ties.push([k, k + 1]); });
  streams(job).forEach(([a, b]) => { if (job.joints.slice(a, b).includes("slur")) slurs.push([a, b]); });
  return { ties, slurs, all: ties.concat(slurs) };
}
function readCurves(notes, curves) {                                                 // 곡선 → 이음매. 같은 높이의 이웃한 두 음만 이으면 붙임줄, 그 밖에는 이음줄
  const joints = Array(notes.length - 1).fill("gap");
  const isTie = ([i, j]) => j === i + 1 && samePitch(notes[i].p, notes[j].p);
  curves.filter(isTie).forEach(([i]) => { joints[i] = "tie"; });
  curves.filter((c) => !isTie(c)).forEach(([i, j]) => { for (let k = i; k < j; k++) if (joints[k] !== "tie") joints[k] = "slur"; });
  return joints;
}
const ambiguous = (job) => toCurves(job).slurs.filter(([a, b]) => b === a + 1 && samePitch(job.notes[a].p, job.notes[b].p));   // 붙임줄로 읽히고 마는 이음줄

// ── 붙임줄은 왜 필요한가 ──
function singleNote(beats, beatDen = 4, maxDots = 1) {                               // 이 길이를 음표 하나로 적을 수 있으면 그 음표
  const whole = div(beats, F(beatDen));
  for (let dots = 0; dots <= maxDots; dots++) {
    const den = div(F(2 ** (dots + 1) - 1, 2 ** dots), whole);
    if (den.d === 1 && isPow2(den.n)) return { den: den.n, dots };
  }
  return null;
}
function whyTie(job, k) {                                                            // bar 마디선을 넘는다 · need 음표 하나로 적을 수 없다 · choice 음표 하나로도 적을 수 있다
  if (job.joints[k] !== "tie") return null;
  if (onBar(job, k)) return "bar";
  const s = sounds(job).find((x) => x.from <= k && k < x.to);
  return singleNote(s.dur, job.meter[1]) ? "choice" : "need";
}

// ── 소리 예약표(초). 첫 음의 시작이 0 ──
const beatsToSec = (beats, bpm) => (num(beats) * 60) / bpm;
function schedule(job, bpm = job.bpm) {
  const list = sounds(job);
  return list.map((s, i) => ({ t: beatsToSec(s.start, bpm), len: beatsToSec(s.len, bpm), midi: midiOf(s.p), attack: s.attack,
    release: s.after !== "slur" ? "cut" : samePitch(s.p, list[i + 1].p) ? "dip" : "over" }));
}

// ── 검수: 내 이음매를 정답과 견준다 ──
function inspect(job, truth) {
  const out = [];
  truth.forEach((want, k) => {
    const got = job.joints[k];
    if (got === want) return;
    const why = want === "tie" ? "tie-missed" : got === "tie" ? (want === "slur" ? "tie-in-slur" : "tie-no-curve") : want === "slur" ? "slur-broken" : "slur-extra";
    out.push({ k, want, got, why });
  });
  return out;
}

// ── 밸브(손) 판정: 누른 구간 [누름, 뗌](박)만 받는 순수 함수 ──
// 누른 채로 지나가야 하는 이음매: 붙임, 높이가 다른 이음. 뗐다 눌러야 하는 이음매: 뗌, 높이가 같은 이음
const expectHeld = (job, k) => job.joints[k] === "tie" || (job.joints[k] === "slur" && !canTie(job, k));
function pressPlan(job) {                                                            // 설계도대로 누를 구간
  const st = starts(job), total = totalBeats(job), out = [];
  let a = F(0);
  job.joints.forEach((jt, k) => {
    if (expectHeld(job, k)) return;
    const s = sounds(job).find((x) => x.from <= k && k <= x.to);
    out.push([a, sub(st[k + 1], jt === "gap" ? s.gap : F(1, 16))]);
    a = st[k + 1];
  });
  out.push([a, total]);
  return out;
}
function judgeHold(holds, job, eps = 1 / 16, win = 1 / 4) {
  const st = starts(job).map(num);
  const heldThrough = (t) => holds.some(([a, b]) => a <= t - eps && t + eps <= b);
  const pressNear = (t) => holds.some(([a]) => Math.abs(a - t) <= win);
  const first = holds.some(([a, b]) => a <= win && b >= eps);                          // 첫 음이 시작할 때 누르고 있었는가(준비 박에서 미리 눌러도 된다)
  const joints = job.joints.map((want, k) => {
    const held = expectHeld(job, k), t = st[k + 1];
    return { k, want, expectHeld: held, ok: held ? heldThrough(t) : pressNear(t) && !heldThrough(t) };
  });
  const planned = 1 + joints.filter((j) => !j.expectHeld).length;                      // 설계도대로면 누르는 횟수
  const extra = holds.filter(([a], i) => i > 0 && !st.some((t) => Math.abs(a - t) <= win)).length;   // 음표 한가운데에서 새로 누른 횟수(이음매 근처의 누름은 이음매 쪽에서, 첫 누름은 first에서 센다)
  const errors = joints.filter((j) => !j.ok).length + extra + (first ? 0 : 1);
  return { joints, first, extra, presses: holds.length, planned, errors, grade: errors === 0 ? "smooth" : errors === 1 ? "drip" : "leak" };
}

// ── 우리말 ──
const SOLFA = ["도", "레", "미", "파", "솔", "라", "시"];                              // 계이름 글자. 이론 표가 아니다
const GLYPH = { "1/2": "½", "1/4": "¼", "3/4": "¾" };                                // 분수 글자

const noteKo = (den, dots = 0) => "점".repeat(dots) + (den === 1 ? "온음표" : den + "분음표");
function beatsKo(f) {
  const whole = floorF(f), rest = F(f.n - whole * f.d, f.d);
  if (rest.n === 0) return whole + "박";
  return (GLYPH[str(rest)] ? (whole || "") + GLYPH[str(rest)] : str(f)) + "박";
}
const JOINT_KO = { gap: "뗌", slur: "이음", tie: "붙임" };
const soundLine = (job) => sounds(job).map((s, i, all) => solfa(s.p) + " " + beatsKo(s.dur) + (i < all.length - 1 ? (s.after === "slur" ? " → " : " · ") : "")).join("");

// ═══ 제품용 확장(의뢰 스파이크부터) ═══
// ── 셈 의뢰: 보기와 답은 글자열 열쇠("3", "5/2")로 견준다 ──
const fromStr = (s) => { const [n, d] = String(s).split("/").map(Number); return F(n, d || 1); };
const longest = (job) => sounds(job).reduce((a, s) => (lt(a.dur, s.dur) ? s : a));          // 가장 긴 소리(같으면 앞의 것)
const countAnswer = (job, q) => (q === "bells" ? String(bells(job)) : str(longest(job).dur));
function countChoices(job, q) {                                                      // 방울: 1~음표 수. 길이: 정답, 이음줄 안을 다 더한 값, 음표 하나하나, 전체에서 넷까지
  if (q === "bells") return Array.from({ length: job.notes.length }, (_, i) => String(i + 1));
  const cand = [];
  const push = (f) => { if (!cand.some((c) => eq(c, f))) cand.push(f); };
  push(longest(job).dur);
  toCurves(job).slurs.forEach(([a, b]) => { let t = F(0); for (let i = a; i <= b; i++) t = add(t, durOf(job, i)); push(t); });
  job.notes.forEach((_, i) => push(durOf(job, i)));

}
function countCause(job, q, picked) {                                                // 틀린 셈의 원인
  const C = toCurves(job);

    if (!C.all.length) return "no-curve";                                            // 곡선이 없으면 음표마다 방울
    if (+picked > bells(job)) return "tie-counted";                                  // 붙임줄 뒤의 음도 셌다
    return C.slurs.length ? "slur-merged" : "tie-over";                              // 이음줄을 한 음으로 셌다 · 붙임줄 밖의 음까지 합쳤다
  }
  const top = longest(job);
  if (lt(fromStr(picked), top.dur)) return top.to > top.from ? "not-summed" : "note-length";   // 붙인 길이를 더하지 않았다 · 음표 길이를 잘못 읽었다
  return C.slurs.length ? "slur-summed" : "over-summed";                             // 이음줄 안을 더했다 · 곡선 없는 음까지 더했다
}
const countLabel = (q, key) => (q === "bells" ? key + "번" : beatsKo(fromStr(key)));

// ── 검수에서 먼저 말할 원인: 초안의 순서(같은 음과 소리 시작 → 선율의 연결), 같으면 앞의 이음매 ──
const CAUSE_ORDER = ["tie-missed", "tie-in-slur", "tie-no-curve", "slur-broken", "slur-extra"];
const firstCause = (list) => list.slice().sort((a, b) => CAUSE_ORDER.indexOf(a.why) - CAUSE_ORDER.indexOf(b.why) || a.k - b.k)[0] || null;

// ── 말 의뢰의 문장 틀 ──
function wordKind(job) {
  const n = job.notes.length, j = job.joints;
  if (n === 2 && j[0] === "tie") return "tie-pair";                                  // "두 도를 한 번만 소리 나게 붙여 주세요."
  if (j.length && j.every((x) => x === "slur")) return "slur-all";                   // "도 레 미를 틈 없이 이어 주세요."
  if (j.includes("tie") && j.includes("gap") && j.every((x, k) => (canTie(job, k) ? x === "tie" : x === "gap"))) return "tie-all";   // "붙일 수 있는 곳을 모두 붙여 주세요."
  return null;
}

// ── 도면 카드: 이 의뢰가 다루는 연결의 종류 ──

  if (!C.all.length) add1("plain");

    if (jt === "tie") {
      const w = whyTie(job, k), s = sounds(job).find((x) => x.from <= k && k < x.to), one = singleNote(s.dur, job.meter[1]);
      add1(w === "bar" ? "tie-bar" : w === "need" ? "tie-need" : one && one.dots ? "tie-dot" : "tie");
    }
    if (jt === "slur") add1(canTie(job, k) ? "slur-same" : "slur");
  });
  C.slurs.forEach(([a, b]) => { if (job.joints.slice(a, b).includes("tie")) add1("tie-in-slur"); });

}
const eul = (word) => word + ((word.charCodeAt(word.length - 1) - 0xac00) % 28 ? "을" : "를");   // 받침에 따라 을/를

const ASK_KO = { word: "말", score: "설계도", sound: "소리", repair: "수리", count: "셈" };

/* JOINT · Web Audio scheduling and valve input.
 * The synthesis/envelopes and timing constants are copied from Appendix C.7–C.8.
 * Adaptation: DOM writes are callbacks, so the one-file application owns its UI.
 */
class WorkshopAudio {
  constructor(options = {}) {
    this.options = options;
    this.ctx = null;
    this.master = null;
    this.noiseBuf = null;
    this.wave = null;
    this.run = null;
    this.valve = null;
    this.live = new Set();
    this.raf = 0;
    this.volume = 1;
    this.valved = false;
    this.endedAt = -1e9;
    this._now = options.now || (() => performance.now());
    this._raf = options.raf || ((fn) => requestAnimationFrame(fn));
    this._caf = options.cancelRaf || ((id) => cancelAnimationFrame(id));
    this._visibility = () => {
      if (typeof document !== 'undefined' && document.hidden && this.run) this.abort('hidden');
    };
    this._blur = () => { if (this.run) this.abort('blur'); };
    this._stateChange = () => {
      this._notifyState();
      const r = this.run;
      if (r && !r.perf && this.ctx.state !== 'running' && r.audioStarted) this.abort('sound');
    };
    if (typeof document !== 'undefined') document.addEventListener('visibilitychange', this._visibility);
    if (typeof window !== 'undefined') {
      window.addEventListener('blur', this._blur);
      window.addEventListener('pagehide', this._blur);
    }
  }

  _emit(name, value) {
    if (typeof this.options[name] === 'function') this.options[name](value);
  }

  _notifyState() {
    this._emit('onState', { enabled: !!this.ctx && this.ctx.state === 'running', state: this.ctx ? this.ctx.state : 'unavailable', fallback: !!this.run && this.run.perf });
  }

  initialize() {
    try {
      if (!this.ctx || this.ctx.state === 'closed') {
        const AC = this.options.contextFactory || (typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext));
        if (!AC) { this._notifyState(); return null; }
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.8 * this.volume;
        this.master.connect(this.ctx.destination);
        this.noiseBuf = this.ctx.createBuffer(1, this.ctx.sampleRate, this.ctx.sampleRate);
        const d = this.noiseBuf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        this.wave = this.ctx.createPeriodicWave(new Float32Array(7), new Float32Array([0, 1, 0.42, 0.26, 0.1, 0.06, 0.03]));
        this.ctx.addEventListener('statechange', this._stateChange);
      }
      if (this.ctx.state !== 'running') {
        const p = this.ctx.resume();
        if (p && p.catch) p.catch(() => this._notifyState());
      }
      this._notifyState();
      return this.ctx;
    } catch (error) {
      this._emit('onError', error);
      this._notifyState();
      return null;
    }
  }

  setVolume(value) {
    this.volume = Math.max(0, Math.min(1, Number(value) || 0));
    if (this.master && this.ctx) this.master.gain.setValueAtTime(0.8 * this.volume, this.ctx.currentTime);
  }

  _keep(node) {
    this.live.add(node);
    node.addEventListener('ended', () => this.live.delete(node));
    return node;
  }

  _silence() {
    this.live.forEach((node) => { try { node.stop(); } catch (_) { /* already ended */ } });
    this.live.clear();
  }

  _pipeTone(midi, when, len, attack, release) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    const peak = 0.24, up = attack === 'legato' ? 0.03 : 0.018, end = when + len;
    o.setPeriodicWave(this.wave);
    o.frequency.setValueAtTime(hz(midi), when);
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(peak, when + up);
    if (release === 'over') {
      g.gain.setValueAtTime(peak, end);
      g.gain.linearRampToValueAtTime(0.0001, end + 0.03);
    } else if (release === 'dip') {
      g.gain.setValueAtTime(peak, Math.max(when + up, end - 0.07));
      g.gain.linearRampToValueAtTime(0.0001, end - 0.012);
    } else {
      g.gain.setValueAtTime(peak, Math.max(when + up, end - 0.04));
      g.gain.linearRampToValueAtTime(0.0001, end);
    }
    o.connect(g); g.connect(this.master); o.start(when); o.stop(end + 0.06);

  _burst(when, dur, freq, q, peak) {
    const s = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();

    s.connect(f); f.connect(g); g.connect(this.master); s.start(when); s.stop(when + dur + 0.02);
    return this._keep(s);

  _drop(when, fresh) { return this._burst(when, 0.035, 1900, 1.4, fresh ? 0.22 : 0.08); }
  _tick(when, strong) { return this._burst(when, 0.035, strong ? 2600 : 1700, 6, strong ? 0.6 : 0.35); }
  latency() { return this.ctx ? this.ctx.outputLatency || this.ctx.baseLatency || 0 : 0; }
  clock() { return this.run && this.run.perf ? this._now() / 1000 : this.ctx.currentTime - this.latency(); }

  // A pure, inspectable plan. Every audio event is submitted before the first frame.
  static buildPlan(job, options = {}) {
    const bpm = options.bpm || 60, beat = 60 / bpm, kind = options.kind || 'trial';
    const valving = kind === 'hand' || kind === 'machine';
    const countIn = valving ? (options.countIn === undefined ? 4 : options.countIn) : 0;

    if (valving) {

    }
    return { kind, bpm, beat, total, countIn, ticks, tones: kind === 'hand' ? [] : schedule(job, bpm), holds: valving ? pressPlan(job).map(([a, b]) => [num(a), num(b)]) : [], duration: (countIn + total) * beat + 0.42 };
  }

  play(jobOrNotes, jointsOrOptions = {}, options = {}) {
    let job, opts;
    if (Array.isArray(jobOrNotes)) {
      opts = options;
      job = { notes: jobOrNotes, joints: jointsOrOptions, meter: opts.meter || [4, 4], bpm: opts.bpm || 60 };
    } else { job = jobOrNotes; opts = jointsOrOptions || {}; }
    const kind = opts.kind || 'trial', valving = kind === 'hand' || kind === 'machine';
    if (kind === 'hand' && this._now() - this.endedAt < 600) return null;
    this.stop();
    const a = this.initialize();
    const plan = WorkshopAudio.buildPlan(job, { ...opts, kind, countIn: opts.countIn === undefined ? (this.valved ? 2 : 4) : opts.countIn });
    const t0 = (a ? a.currentTime : this._now() / 1000) + 0.12;
    const r = { ...plan, job, perf: !a, t0, tb0: t0 + plan.countIn * plan.beat, end: t0 + (plan.countIn + plan.total) * plan.beat + 0.3,
      holds: [], down: null, ctx0: a ? a.currentTime : 0, p0: this._now(), lastNow: null, lastAt: this._now(), correctionMs: Number(opts.correctionMs) || 0,
      audioStarted: !!a && a.state === 'running', plan: plan.holds };
    this.run = r;
    if (valving) this.valved = true;
    if (a) {
      try {
        for (const x of plan.ticks) this._tick(t0 + x.t, x.strong);
        for (const x of plan.tones) {
          this._pipeTone(x.midi, r.tb0 + x.t, x.len, x.attack, x.release);
          this._drop(r.tb0 + x.t, x.attack === 'fresh');
        }
      } catch (error) { this._emit('onError', error); this._toPerformance(r); }
    }
    this._emit('onStart', r);
    this.raf = this._raf(() => this._frame());
    return r;
  }

  _toPerformance(r) {
    this._stopValveSound(); this._silence();
    const shift = this._now() / 1000 + 0.1 - r.t0;
    r.perf = true; r.t0 += shift; r.tb0 += shift; r.end += shift;
    r.holds = []; r.down = null;
    this._notifyState();
  }

  _frame() {
    const r = this.run;
    if (!r) return;
    if (!r.perf && this._now() - r.p0 > 1200 && this.ctx.currentTime === r.ctx0) this._toPerformance(r);
    const now = this.clock(), beat = (now - r.tb0) / r.beat;
    if (!r.perf) {
      if (this.ctx.state === 'running') r.audioStarted = true;
      if (now !== r.lastNow) { r.lastNow = now; r.lastAt = this._now(); }
      else if (this.ctx.currentTime !== r.ctx0 && this._now() - r.lastAt > 800) { this.abort('sound'); return; }
    }
    const label = beat < 0 && r.countIn ? String(Math.min(r.countIn, Math.max(1, r.countIn - Math.ceil(-beat) + 1))) : '';
    const pressed = r.kind === 'machine' ? r.plan.some(([a, b]) => beat >= a && beat < b) : r.down !== null;
    this._emit('onFrame', { beat, total: r.total, kind: r.kind, countIn: r.countIn, label, holds: r.holds, down: r.down, pressed, fallback: r.perf, run: r });
    if (now >= r.end) { this._finish(); return; }
    this.raf = this._raf(() => this._frame());
  }

  _inputBeat(r) { return (this.clock() - r.correctionMs / 1000 - r.tb0) / r.beat; }

  valveStart() {
    const r = this.run;
    if (!r || r.kind !== 'hand' || r.down !== null) return false;
    const b = this._inputBeat(r);
    if (b >= r.total) return false;
    r.down = b;
    if (this.ctx && !r.perf) this._startValveSound(r);
    this._emit('onValve', { pressed: true, beat: b });
    return true;
  }

  valveStop() {
    const r = this.run;
    if (!r || r.kind !== 'hand' || r.down === null) { this._stopValveSound(); return false; }
    const b = this._inputBeat(r);
    if (b > 0) r.holds.push([r.down, Math.min(b, r.total)]);
    r.down = null;
    this._stopValveSound();
    this._emit('onValve', { pressed: false, beat: b });
    return true;
  }

  _startValveSound(r) {
    const job = r.job, st = starts(job).map(num), t = this.ctx.currentTime;
    const when = Math.max(t, r.tb0), endT = r.tb0 + r.total * r.beat;
    if (when >= endT) return;
    const bs = (when - r.tb0) / r.beat;
    let i0 = 0;
    st.forEach((s, i) => { if (s <= bs + 1e-9) i0 = i; });
    const o = this.ctx.createOscillator(), g = this.ctx.createGain(), extras = [];
    o.setPeriodicWave(this.wave);
    o.frequency.setValueAtTime(hz(midiOf(job.notes[i0].p)), when);
    for (let i = i0 + 1; i < st.length; i++) {
      const T = r.tb0 + st[i] * r.beat;
      o.frequency.setValueAtTime(hz(midiOf(job.notes[i].p)), T);
      if (!samePitch(job.notes[i].p, job.notes[i - 1].p)) extras.push(this._drop(T, false));
    }
    g.gain.setValueAtTime(0.0001, when); g.gain.linearRampToValueAtTime(0.24, when + 0.018);
    g.gain.setValueAtTime(0.24, Math.max(when + 0.018, endT - 0.04));
    g.gain.linearRampToValueAtTime(0.0001, Math.max(when + 0.019, endT));

    this.valve = { o, g, extras };
  }

  _stopValveSound() {
    if (!this.valve) return;
    const t = this.ctx.currentTime, v = this.valve;
    try { v.g.gain.cancelScheduledValues(t); v.g.gain.setTargetAtTime(0.0001, t, 0.012); v.o.stop(t + 0.09); } catch (_) { /* already ended */ }
    v.extras.forEach((node) => { try { node.stop(); } catch (_) { /* already ended */ } });
    this.valve = null;
  }

  _finish() {
    const r = this.run;
    if (!r) return;
    if (r.kind === 'hand' && r.down !== null) { r.holds.push([r.down, r.total]); r.down = null; }
    const result = { kind: r.kind, holds: r.kind === 'machine' ? r.plan : r.holds, judgment: r.kind === 'hand' ? judgeHold(r.holds, r.job) : null, machine: r.kind === 'machine', fallback: r.perf };
    this.stop();
    if (r.kind === 'hand' || r.kind === 'machine') this.endedAt = this._now();
    this._emit('onFinish', result);
  }

  stop() {
    if (this.raf) this._caf(this.raf);
    this.raf = 0;
    this._stopValveSound(); this._silence(); this.run = null;
  }

  abort(reason = 'sound') {
    const hadRun = !!this.run;
    this.stop();
    if (hadRun) this._emit('onAbort', { reason, text: reason === 'hidden' || reason === 'blur' ? '화면을 떠나서 멈췄어요. 다시 시작해 주세요.' : '소리가 멈춰서 중단했어요. 소리를 켜고 다시 시작해 주세요.' });
  }

  resetDay() { this.valved = false; }

  dispose() {
    this.stop();
    if (typeof document !== 'undefined') document.removeEventListener('visibilitychange', this._visibility);
    if (typeof window !== 'undefined') { window.removeEventListener('blur', this._blur); window.removeEventListener('pagehide', this._blur); }
    if (this.ctx) this.ctx.removeEventListener('statechange', this._stateChange);
  }
}

/* AU checks use a deterministic AudioContext/AudioParam spy.
 * They verify submitted events and lifecycle/clock code, not real PCM rendering,
 * speaker audibility, physical touch latency, or Safari's device audio policy.
 */
function runAudioTests() {
  const results = [];
  const assert = (condition, message = 'Audio assertion failed') => { if (!condition) throw new Error(message); };
  const near = (a, b) => Math.abs(a - b) < 1e-8;
  const test = (id, fn) => {
    try { results.push({ id, pass: true, detail: fn() || '모의 AudioContext 예약·상태 검증' }); }
    catch (error) { results.push({ id, pass: false, error: error.message }); }
  };
  const sample = (joints = 'tss') => makeJob({ meter: '4/4', notes: 'C4/4 C4/4 D4/4 E4/4', joints });
  function harness(extra = {}) {
    const env = { now: 0, nodes: [], frames: [], finished: [], aborted: [], states: [], pending: null };
    class Param {
      constructor() { this.value = 0; this.log = []; }
      setValueAtTime(value, time) { this.log.push({ kind: 'set', value, time }); }
      linearRampToValueAtTime(value, time) { this.log.push({ kind: 'linear', value, time }); }
      exponentialRampToValueAtTime(value, time) { this.log.push({ kind: 'exp', value, time }); }
      cancelScheduledValues(time) { this.log.push({ kind: 'cancel', time }); }
      setTargetAtTime(value, time, constant) { this.log.push({ kind: 'target', value, time, constant }); }
    }
    class Node {
      constructor(kind) { this.kind = kind; this.gain = new Param(); this.frequency = new Param(); this.Q = {}; this.stops = []; this.listeners = {}; env.nodes.push(this); }
      connect(target) { this.connected = target; return target; }
      addEventListener(name, fn) { this.listeners[name] = fn; }
      setPeriodicWave(wave) { this.wave = wave; }
      start(time) { this.started = time; this.called = env.now; }
      stop(time) { this.stops.push(time); }
    }
    class Context {
      constructor() { this.state = extra.suspended ? 'suspended' : 'running'; this.currentTime = 0; this.sampleRate = 100; this.destination = {}; this.handlers = {}; this.outputLatency = 0.02; }
      createGain() { return new Node('gain'); }
      createOscillator() { return new Node('osc'); }
      createBufferSource() { return new Node('noise'); }
      createBiquadFilter() { return new Node('filter'); }
      createPeriodicWave(real, imag) { return { real, imag }; }
      createBuffer() { return { getChannelData: () => new Float32Array(100) }; }
      addEventListener(name, fn) { this.handlers[name] = fn; }
      removeEventListener(name) { delete this.handlers[name]; }
      resume() { return null; } // Intentionally does not advance or unlock a clock.
    }
    const Factory = extra.unavailable ? class { constructor() { throw new Error('Simulated unavailable AudioContext'); } } : Context;
    env.audio = new WorkshopAudio({ contextFactory: Factory, now: () => env.now, raf: fn => { env.pending = fn; return 1; }, cancelRaf: () => { env.pending = null; },
      onFrame: frame => env.frames.push(frame), onFinish: result => env.finished.push(result), onAbort: reason => env.aborted.push(reason), onState: state => env.states.push(state) });
    env.oscillators = () => env.nodes.filter(n => n.kind === 'osc');
    return env;
  }

  test('AU-01', () => {
    const env = harness();
    try {
      env.audio.play(sample());
      const osc = env.oscillators(), times = [0.12, 2.12, 3.12], pitches = [60, 62, 64];
      assert(osc.length === 3, 'Tied note must not create another oscillator');
      osc.forEach((o, i) => { assert(near(o.started, times[i])); assert(near(o.frequency.log[0].value, hz(pitches[i]))); assert(o.called === 0, 'All tones must be submitted before the first frame'); });
      assert(env.nodes.filter(n => n.kind === 'noise').length === 3, 'One unpitched drop per sound');
      return '모의 예약: 0.12·2.12·3.12초 / 도·레·미. 첫 프레임 전에 모두 예약';
    } finally { env.audio.dispose(); }
  });

  test('AU-02', () => {
    const env = harness();
    try {
      env.audio.play(sample());
      const old = [...env.audio.live];
      env.audio.play(sample('ggg'));
      assert(old.every(n => n.stops.includes(undefined)), 'Every old event must be cancelled before replacement');
      const current = [...env.audio.live];
      env.audio.stop();
      assert(current.every(n => n.stops.includes(undefined)) && env.audio.live.size === 0);
      return '모의 노드: 재생 교체·정지 때 이전 발진기와 예약 방울 전부 stop()';
    } finally { env.audio.dispose(); }
  });

  test('AU-03', () => {
    const cases = [];
    for (const joint of ['t', 's', 'g']) {
      const env = harness();
      try {
        const job = makeJob({ meter: '2/4', notes: 'C4/4 C4/4', joints: joint });
        env.audio.play(job);
        const osc = env.oscillators(), first = osc[0].connected.gain.log;
        if (joint === 't') assert(osc.length === 1 && near(osc[0].stops[0], 2.18), 'Tie must be one sustained envelope');
        if (joint === 's') assert(osc.length === 2 && first.some(e => e.kind === 'linear' && near(e.value, 0.0001) && near(e.time, 1.108)), 'Same-pitch slur must dip 12 ms before the new sound');
        if (joint === 'g') assert(osc.length === 2 && first.some(e => e.kind === 'linear' && near(e.value, 0.0001) && near(e.time, 0.87)) && near(osc[1].started, 1.12), 'Gap must leave a quarter-beat without tone');
        cases.push(joint);
      } finally { env.audio.dispose(); }
    }
    assert(cases.length === 3);
    return '모의 AudioParam: 붙임 단일 지속음·같은 음 이음 dip·뗌 ¼박 빈틈. 실제 파형·청취는 별도';
  });

  test('AU-04', () => {
    const suspended = harness(), frozen = harness(), hidden = harness();
    try {
      suspended.audio.play(sample());
      suspended.audio.ctx.state = 'suspended'; suspended.audio.ctx.handlers.statechange();
      assert(suspended.audio.run === null && suspended.aborted[0]?.reason === 'sound');
      assert(suspended.states.at(-1)?.enabled === false, 'Suspended context must expose disabled sound');
      frozen.audio.play(sample());
      frozen.audio.ctx.currentTime = 0.2; frozen.now = 200; frozen.audio._frame();
      frozen.now = 1101; frozen.audio._frame();
      assert(frozen.audio.run === null && frozen.aborted[0]?.reason === 'sound', 'A moving-then-frozen clock must abort after 800 ms');
      hidden.audio.play(sample()); hidden.audio.abort('hidden');
      assert(hidden.audio.run === null && hidden.audio.live.size === 0 && hidden.aborted[0]?.reason === 'hidden');
      return '모의 statechange·800ms 시계 정지·화면 이탈 중단 경로. 실제 브라우저 visibility 전환은 화면 검증';
    } finally { suspended.audio.dispose(); frozen.audio.dispose(); hidden.audio.dispose(); }
  });

  test('AU-05', () => {
    const env = harness();
    try {
      env.audio.play(sample());
      const r = env.audio.run;
      env.audio.ctx.currentTime = r.tb0 + 1.5 * r.beat + env.audio.latency();
      env.audio._frame();
      assert(near(env.frames.at(-1).beat, 1.5));
      env.audio.ctx.currentTime = r.tb0 + 2.25 * r.beat + env.audio.latency();
      env.audio._frame();
      assert(near(env.frames.at(-1).beat, 2.25));
      return '출력 지연 20ms를 뺀 오디오 시각 → 물머리 콜백 1½박·2¼박';
    } finally { env.audio.dispose(); }
  });

  test('AU-06', () => {
    const env = harness();
    try {
      env.audio.play(sample(), { kind: 'hand' });
      assert(env.oscillators().length === 0, 'Hand mode must not pre-play the answer');
      env.audio.valveStart();
      assert(env.oscillators().length === 1, 'One held oscillator');
      const osc = env.oscillators()[0], frequencies = osc.frequency.log;
      assert(frequencies.length === 4 && frequencies[0].value === frequencies[1].value);
      assert(near(frequencies[2].time, env.audio.run.tb0 + 2));
      assert(near(frequencies[3].time, env.audio.run.tb0 + 3));
      const extras = [...env.audio.valve.extras];
      env.audio.ctx.currentTime = env.audio.run.tb0 + 0.5;
      env.audio.valveStop();
      assert(env.audio.valve === null && extras.every(n => n.stops.includes(undefined)));
      assert(osc.connected.gain.log.some(e => e.kind === 'cancel') && osc.connected.gain.log.some(e => e.kind === 'target' && e.constant === 0.012));
      return '모의 손 밸브: 누름 발진기 하나·미래 주파수 선예약·뗌 때 게인과 방울 취소';
    } finally { env.audio.dispose(); }
  });

  test('AU-07', () => {
    const env = harness();
    try {
      env.audio.play(sample(), { kind: 'hand' }); assert(env.audio.run.countIn === 4);
      env.audio.stop(); env.audio.play(sample(), { kind: 'machine' }); assert(env.audio.run.countIn === 2);
      env.audio.stop(); env.audio.resetDay(); env.audio.play(sample(), { kind: 'machine' }); assert(env.audio.run.countIn === 4);
      const p = WorkshopAudio.buildPlan(makeJob({ meter: '2/4', notes: 'C4/4 E4/4 E4/4 C4/4', joints: 'gtg' }), { kind: 'machine', countIn: 4 });
      assert(p.ticks.length === 9);
      assert(p.ticks.filter(t => t.strong).map(t => t.t).join(',') === '0,4,6,8');
      return '준비 박 4→2·새 작업일 4 / 2박자 센박 0·4·6·8초 예약';
    } finally { env.audio.dispose(); }
  });

  test('AU-08', () => {
    const unavailable = harness({ unavailable: true }), blocked = harness({ suspended: true });
    try {
      unavailable.audio.play(sample()); assert(unavailable.audio.run.perf);
      unavailable.now = 5000; unavailable.audio._frame(); assert(unavailable.finished.length === 1 && unavailable.finished[0].fallback);
      blocked.audio.play(sample()); assert(!blocked.audio.run.perf);
      blocked.now = 1300; blocked.audio._frame();
      assert(blocked.audio.run.perf && blocked.audio.live.size === 0);
      blocked.now = 7000; blocked.audio._frame(); assert(blocked.finished.length === 1 && blocked.finished[0].fallback);
      return '모의 생성 거부·정지한 suspended 시계: 1.2초 뒤 화면 시계 전환·끝까지 진행';
    } finally { unavailable.audio.dispose(); blocked.audio.dispose(); }
  });

  test('AU-09', () => {
    const plan = WorkshopAudio.buildPlan(sample(), { bpm: 50 });
    assert(plan.tones.length === 3);
    [0, 2.4, 3.6].forEach((time, i) => assert(near(plan.tones[i].t, time)));
    assert(near(plan.tones[0].len, 2.4) && near(plan.beat, 1.2));
    return '♩=50 모의 예약표: 0·2.4·3.6초 / 붙인 소리 2.4초';
  });
  return results;
}

 let frame=null;const makeFrame=()=>{if(frame)frame.remove();frame=document.createElement('iframe');frame.title='독립 화면 검사';frame.style.cssText='position:fixed;left:-12000px;top:0;border:0;visibility:hidden';document.body.append(frame);};
 const next=()=>{if(!sizes.length){frame.remove();window.removeEventListener('message',onMessage);window.__layoutTests=results;const failed=results.flatMap(r=>r.failures);const ct=window.__tests.find(x=>x.id==='CT-03');if(ct){ct.pass=!failed.some(f=>f.type==='text');ct.status=ct.pass?'PASS':'FAIL';ct.error=ct.pass?'':JSON.stringify(failed.filter(f=>f.type==='text').slice(0,3));ct.detail=`${results.reduce((s,r)=>s+r.scenes,0)}장면 및 원인 문구 · 최대 ${Math.max(...results.map(r=>r.maxLines))}줄`;}if(S.screen==='tests'){$('screenContent').innerHTML=testResultsMarkup();$('layoutResult').textContent=results.map(r=>`${r.viewport}: ${r.scenes}장면 · ${r.totalFailures}건 문제 · 정렬 차 ${r.alignmentPx}px`).join(' / ');}return;}const [w,h]=sizes.shift();makeFrame();frame.width=w;frame.height=h;frame.src=location.pathname+'#layout-only';};
 const onMessage=e=>{if(e.source===frame.contentWindow&&e.data?.type==='joint-layout-result'){results.push(e.data.result);next();}};
 window.addEventListener('message',onMessage);next();
}
